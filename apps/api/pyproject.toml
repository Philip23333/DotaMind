[project]
name = "dotamind-api"
version = "0.1.0"
description = "FastAPI service for composable esports intelligence reports."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langgraph>=1.2.7,<2.0.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
