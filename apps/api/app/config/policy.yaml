# DotaMind business policy. Secrets and environment-specific URLs stay in .env.
version: 1

opendota:
  request_timeout_seconds: 20
  default_cache_ttl_seconds: 3600

stratz:
  weeks_back_default: 1   # null weeks_back -> latest completed STRATZ week
  weeks_back_max: 8       # guardrail: N weeks = N STRATZ calls per tool

team_report:
  default_time_range_days: 30
  resolution:
    generic_words: [team, esports, gaming]
    fuzzy_score_cutoff: 55.0
    ambiguity_score_delta: 2.0
    candidate_limit: 5
  match_details:
    default_sample_size: 50
    max_sample_size: 100
    concurrency: 10
    cache_ttl_seconds: 2592000  # 30 days

hero_report:
  result_limit: 10
  min_pub_pick: 100
  evidence:
    partial_win_rate: 0.51
    supported_win_rate: 0.525
    partial_pro_presence: 0.25
    supported_pro_presence: 0.4
  normalization:
    win_rate_low: 0.45
    win_rate_high: 0.56
    pick_rate_low: 0.02
    pick_rate_high: 0.18

patch_report:
  default_patch: latest
  result_limit: 6
  neutral_score: 0.5
  change_delta: 0.15

critic:
  require_evidence: true
  reject_unsupported_signals: true
  min_evidence_items: 1
  mock_allowed: false
  min_confidence: 0.5
  hard_min_confidence: 0.35
  team_report:
    max_latest_match_age_days: 30
    hard_max_latest_match_age_days: 90
    min_matches_in_window: 5
    min_match_details_analyzed: 5

llm:
  orchestrator:
    temperature: 0.0
    max_tokens: 4000

conversation:
  # Multi-turn session memory (Phase 1: single-process in-memory store).
  history_window: 5              # turns injected into planner prompt
  max_turns_per_session: 50      # turns retained per session
  max_sessions: 1000             # LRU eviction threshold
  answer_summary_max_chars: 300  # per-turn answer summary cap
  turn_query_max_chars: 200      # per-turn query cap stored in history
  history_max_chars: 2000        # hard budget for the rendered history block

planning:
  sample_policy:
    # Single source of truth for sample-size thresholds. Each entry names the
    # input_model field (`arg`) the planner policy fills. `default` must match
    # the tool's Field default (guarded by test_stratz_tool_defaults_match_sample_policy).
    # Tiers satisfy relaxed <= default <= strict. Planner picks a tier per call;
    # apply_sample_policy backfills `default` when the LLM omits/nulls the arg.
    tools:
      stratz.hero_matchup_ranking:      { arg: min_sample_size, default: 2000, relaxed: 500, strict: 5000 }
      stratz.hero_synergy_ranking:      { arg: min_sample_size, default: 2000, relaxed: 500, strict: 5000 }
      stratz.lane_meta_global:          { arg: min_sample_size, default: 1000, relaxed: 300, strict: 3000 }
      stratz.hero_position_stats:       { arg: min_sample_size, default: 1000, relaxed: 300, strict: 3000 }
      stratz.filter_heroes_by_position: { arg: min_position_match_count, default: 1000, relaxed: 300, strict: 3000 }
