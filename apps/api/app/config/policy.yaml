# Provider-neutral runtime policy. Domain capability policy is introduced with
# the capability that owns it.
version: 1

critic:
  require_evidence: true
  reject_unsupported_signals: true
  min_evidence_items: 1
  mock_allowed: false
  min_confidence: 0.5
  hard_min_confidence: 0.35

llm:
  orchestrator:
    temperature: 0.0
    max_tokens: 4000

conversation:
  recent_dialogue_max_chars: 24000
  history_lookup_max_turns: 8
  history_lookup_max_chars: 12000
  history_lookup_max_per_run: 1
  max_turns_per_session: 50
  max_sessions: 1000
  answer_summary_max_chars: 300
  turn_query_max_chars: 200
  request_record_ttl_seconds: 3600
  max_request_records_per_session: 200
  session_ttl_seconds: 86400
  lock_lease_seconds: 90
  lock_acquire_timeout_seconds: 60

planning:
  runtime:
    max_replans: 1
    max_tool_calls_total: 32
    max_controller_calls: 2
    max_answer_calls: 2
    max_elapsed_seconds: 60
