x-api-image: &api-image dotamind-api:local

name: dotamind

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dotamind
      POSTGRES_USER: dotamind
      POSTGRES_PASSWORD: ${DOTAMIND_POSTGRES_PASSWORD:-dotamind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotamind -d dotamind"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: *api-image
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DOTAMIND_ENVIRONMENT: local
      DOTAMIND_DATABASE_URL: postgresql://dotamind:${DOTAMIND_POSTGRES_PASSWORD:-dotamind}@postgres:5432/dotamind
      DOTAMIND_REDIS_URL: redis://redis:6379/0
      DOTAMIND_SESSION_STORE_BACKEND: redis
      DOTAMIND_CORS_ORIGINS: '["http://localhost:${DOTAMIND_WEB_PORT:-3000}","http://127.0.0.1:${DOTAMIND_WEB_PORT:-3000}"]'
      HTTP_PROXY: http://172.29.112.1:10808
      HTTPS_PROXY: http://172.29.112.1:10808
      NO_PROXY: localhost,127.0.0.1,::1,postgres,redis,api,chat,nginx
      http_proxy: http://172.29.112.1:10808
      https_proxy: http://172.29.112.1:10808
      no_proxy: localhost,127.0.0.1,::1,postgres,redis,api,chat,nginx
    ports:
      - "127.0.0.1:${DOTAMIND_API_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  data-updater:
    image: *api-image
    profiles: ["maintenance"]
    entrypoint: ["python", "-m", "app.vnext.data_updates"]
    command: ["--help"]
    restart: "no"
    env_file:
      - .env
    environment:
      DOTAMIND_REDIS_URL: redis://redis:6379/0
      DOTAMIND_DATA_DIR: /var/lib/dotamind/data
      HTTP_PROXY: http://172.29.112.1:10808
      HTTPS_PROXY: http://172.29.112.1:10808
      NO_PROXY: localhost,127.0.0.1,::1,postgres,redis,api,chat,nginx
      http_proxy: http://172.29.112.1:10808
      https_proxy: http://172.29.112.1:10808
      no_proxy: localhost,127.0.0.1,::1,postgres,redis,api,chat,nginx
    volumes:
      - shared-data:/var/lib/dotamind/data

  chat:
    build:
      context: ./apps/chat
      args:
        NEXT_PUBLIC_DOTAMIND_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:${DOTAMIND_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  shared-data:
