services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dotamind
      POSTGRES_USER: dotamind
      POSTGRES_PASSWORD: dotamind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
